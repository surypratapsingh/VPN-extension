<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GeoSwitch</title>
  <style>
    :root {
      --bg: #14161a;
      --panel: #1e2126;
      --border: #2e333b;
      --text: #e6e8eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --good: #22c55e;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      font-size: 14px;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      margin-bottom: 10px;
      font-size: 13px;
    }
    select:disabled { opacity: 0.55; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    button.danger { background: var(--bad); }
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
      margin-top: 8px;
    }
    #status {
      margin-top: 13px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
    }
    #status.connected { color: var(--good); }
    #status.connecting { color: var(--accent); }
    #status.disconnected { color: var(--muted); }
    #status.error { color: var(--bad); }
    #detail {
      margin-top: 5px;
      font-size: 11.5px;
      text-align: center;
      color: var(--muted);
      line-height: 1.45;
      min-height: 15px;
      word-break: break-word;
      white-space: pre-line;
    }
    footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
    footer a { color: #60a5fa; cursor: pointer; text-decoration: none; }
    #pool-info { color: var(--muted); font-size: 11px; text-align: center; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>🌐 GeoSwitch</h1>
  <div id="pool-info">Loading free proxy pool…</div>
  <select id="server-select"></select>
  <button id="connect-btn" disabled>Connect</button>
  <button id="rotate-btn" class="ghost" hidden>Try another proxy</button>
  <div id="status" class="disconnected">Not connected</div>
  <div id="detail"></div>
  <footer>
    <a id="refresh-link">Refresh list</a>
    <a id="options-link">Custom servers</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
