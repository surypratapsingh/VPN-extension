name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run unit tests
        # Explicit glob: e2e-*.js need a real Edge and stay out of CI.
        run: node --test tests/*.test.js
